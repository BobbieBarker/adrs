domain: elixir-otp
title: Elixir OTP / GenServer
description: ADRs covering OTP, GenServer, supervision, BEAM scheduling, and stateful-process testing.

adrs:
  - id: 1
    file: adr-001-reach-for-simpler-primitives-before-genserver.md
    title: Reach for Simpler Primitives Before GenServer
    description: When working on a stateful or service-shaped module, choose the right OTP primitive before reaching for GenServer.
    applies_to:
      content_match:
        - "use GenServer"
        - "GenServer.start_link"
        - "Agent.start"
        - "Agent.start_link"

  - id: 2
    file: adr-002-separate-business-logic-from-server-mechanics.md
    title: Separate GenServer Business Logic From Server Mechanics
    description: When implementing or modifying a GenServer, split it into API, Server, and Impl modules across three files.
    applies_to:
      paths:
        - "**/*_server.ex"
        - "**/*_impl.ex"
      content_match:
        - "use GenServer"

  - id: 3
    file: adr-003-keep-state-small-push-storage-out-of-process.md
    title: Keep GenServer State Small; Push Storage Out of Process
    description: When designing GenServer state, keep coordination data in-process and push bulk storage out.
    applies_to:
      paths:
        - "**/*_server.ex"
        - "**/*_impl.ex"
      content_match:
        - "use GenServer"
        - ":ets.new"
        - "defstruct"

  - id: 4
    file: adr-004-never-block-the-processing-loop.md
    title: Never Block the GenServer Processing Loop
    description: When writing a GenServer callback, do not perform blocking I/O or unbounded computation inline.
    applies_to:
      paths:
        - "**/*_server.ex"
      content_match:
        - "def handle_call"
        - "def handle_cast"
        - "def handle_info"

  - id: 5
    file: adr-005-get-slow-work-off-the-loop.md
    title: Get Slow Work Off the Processing Loop
    description: When a callback needs slow work, use handle_continue, Task.Supervisor, or GenServer.reply.
    applies_to:
      content_match:
        - "handle_continue"
        - "Task.Supervisor"
        - "GenServer.reply"
        - "async_nolink"

  - id: 6
    file: adr-006-use-genstage-for-producer-consumer-pipelines.md
    title: Use GenStage for Producer-Consumer Pipelines
    description: When building a producer-consumer pipeline, use GenStage, Flow, or Broadway. Do not build it on naked cast.
    applies_to:
      content_match:
        - "GenStage"
        - "Broadway"
        - "Flow"
        - "GenServer.cast"

  - id: 7
    file: adr-007-design-genservers-for-test-isolation.md
    title: Design GenServers for Test Isolation
    description: When implementing or testing a GenServer, accept a configurable name, validate opts with NimbleOptions, and inject collaborators.
    applies_to:
      paths:
        - "test/**/*_test.exs"
        - "**/*_server.ex"
      content_match:
        - "use GenServer"
        - "NimbleOptions"

  - id: 8
    file: adr-008-graceful-shutdown-requires-trap-exit-and-realistic-shutdown.md
    title: Graceful Shutdown Requires trap_exit and a Realistic :shutdown
    description: When a GenServer needs cleanup on shutdown, trap exits and set a realistic :shutdown budget. Do not treat terminate/2 as durable storage.
    applies_to:
      content_match:
        - "def terminate"
        - "trap_exit"
        - "child_spec"
        - "shutdown:"

  - id: 9
    file: adr-009-send-minimal-data-between-processes.md
    title: "Send Minimal Data Between Processes"
    description: "When spawning a task or sending a message that references a large struct like a conn, pass only the fields the receiver needs (or an id it can fetch), never the whole struct."
    applies_to:
      content_match:
        - "spawn(fn"
        - "Task.async"
        - "Task.async_stream"
        - "GenServer.cast"
        - "GenServer.call"
        - "GenServer.start_link"
        - "send("
        - "conn"
        - ":persistent_term"

  - id: 10
    file: adr-010-supervise-long-lived-processes.md
    title: "Supervise Every Long-Lived Process"
    description: "When a process must outlive the call that spawns it, start it under a supervisor (a static child for fixed processes, a DynamicSupervisor for runtime-created ones) rather than a bare spawn or hand-rolled start_link."
    applies_to:
      content_match:
        - "spawn("
        - "spawn_link("
        - "spawn_monitor("
        - "Process.spawn"
        - "Agent.start_link"
        - "GenServer.start_link"
        - "Task.start("

  - id: 11
    file: adr-011-test-otp-code-through-real-processes.md
    title: "Test OTP Code Through Real Processes"
    description: "Start every test-scoped fixture or service with start_supervised!/1."
    applies_to:
      content_match:
        - "start_supervised!"
        - "ExUnit.Case"
        - ":sys.get_state"
        - "Sandbox.allow"
        - "$callers"
        - "test "

  - id: 12
    file: adr-012-shape-of-genserver-state.md
    title: "The Shape of GenServer State"
    description: "A GenServer's state is a struct in its own module with a fully enumerated @type t, @enforce_keys, and one construction function, never a bare map and never a @typep map type."
    applies_to:
      content_match:
        - "defstruct"
        - "@enforce_keys"
        - "State.new"
        - "%State{"
        - "defmodule.*State"
        - "@typep"

  - id: 13
    file: adr-013-scope-pubsub-topics-to-the-entity.md
    title: "Scope PubSub Topics to the Entity, Not the Event Type"
    description: "When entity processes publish or subscribe through Phoenix.PubSub, put the stable entity key in the topic so the Registry lookup selects interested subscribers before local delivery, rather than making every process filter a shared event-type topic. Publish on state change rather than on a timer."
    applies_to:
      content_match:
        - "PubSub.broadcast"
        - "PubSub.subscribe"
        - "Phoenix.PubSub"
        - "broadcast_from"
