name: build-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dist-drift:
    name: retrieval package is valid and in sync (Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elixir: ["1.17", "1.18"]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: ${{ matrix.elixir }}

      - name: Check Elixir formatting
        run: mix format --check-formatted

      - name: Cache Mix.install deps
        uses: actions/cache@v4
        with:
          path: ~/.mix
          key: mix-install-otp-27-elixir-${{ matrix.elixir }}-${{ hashFiles('tools/**/*.ex', 'tools/**/*.exs') }}

      - name: Run parser, generator, reference, and scorer tests
        run: elixir tools/test/run.exs

      - name: Regenerate dist/
        run: elixir tools/build_dist.exs

      - name: Fail if dist/ has drifted from adrs/
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            git diff -- dist/
            git status --short -- dist/
            echo ""
            echo "::error::dist/ is out of sync with adrs/. Run 'elixir tools/build_dist.exs' locally and commit the result."
            exit 1
          fi

      - name: Validate generated rows, schema, catalog, links, and evaluation data
        run: elixir tools/test/validate_generated.exs
